<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UISet</title>
    <meta
      name="description"
      content="Themes, components, kits and templates for Vercel's UI SDK. Keyboard, focus and ARIA come from UI SDK."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141519" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The theme picked in the header, applied before the first paint (see shell.css).
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("uiset-site-theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.siteTheme = t
      } catch (e) {}
    </script>
    <!-- The site's own face, fetched with the page so the first paint already uses it. The
         skins' faces load when a skin shows them (src/site/fonts.css declares them all). -->
    <link rel="preload" href="/fonts/instrument-sans-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
