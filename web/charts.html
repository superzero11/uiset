<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Charts, no React</title>
    <script type="module">
      import "./src/uiset.ts"
      import "./src/charts-demo.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-charts-page">
        <h1>Charts</h1>
        <div class="web-stats" role="group" aria-label="This month">
          <uiset-stat label="Revenue" value="$48,200" change="12%" direction="up" period="vs last month" trend="31,35,33,40,44,48"></uiset-stat>
          <uiset-stat label="Errors" value="23" change="8" direction="up" good="false" period="vs last week" trend="9,12,15,14,19,23"></uiset-stat>
          <uiset-stat label="Churn" value="2.1%" change="0.4 pts" direction="down" good="true"></uiset-stat>
        </div>
        <p class="web-inline-trend">Signups this week <uiset-sparkline label="Signups, last 7 days" values="12,18,,22,19,25,31" variant="area" series="3"></uiset-sparkline> are up again.</p>
        <uiset-line-chart id="revenue" label="Revenue" description="By month, this year"></uiset-line-chart>
        <uiset-bar-chart id="regions" label="Signups by region" orientation="horizontal" sort="descending"></uiset-bar-chart>
        <uiset-scatter-chart id="accounts" label="Accounts" x-label="Seats" y-label="Revenue"></uiset-scatter-chart>
        <uiset-heatmap id="sessions" label="Sessions by hour" measure="Sessions"></uiset-heatmap>
        <uiset-segmented-bar id="plans" label="Plans"></uiset-segmented-bar>
      </main>
    </uiset-root>
  </body>
</html>
