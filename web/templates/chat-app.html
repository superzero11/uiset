<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Chat app page, no React</title>
    <script type="module">
      import "../src/uiset.ts"
      import "../src/templates/chat-app.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-template-page">
        <div class="template-frame">
          <div class="chat-app-template">
            <uiset-chat-threads id="threads" label="Chats" value="chat-1" newable renamable deletable></uiset-chat-threads>
            <div class="chat-app-main">
              <uiset-chat id="chat" label="Conversation" empty-title="What are we working on?"></uiset-chat>
              <uiset-chat-composer id="composer" label="Message" placeholder="Ask anything. Type / for commands, @ to mention a file…" attachments>
                <uiset-chat-model-picker id="model" label="Model" value="balanced"></uiset-chat-model-picker>
                <uiset-chat-usage id="usage" used="0" limit="200000"></uiset-chat-usage>
              </uiset-chat-composer>
            </div>
          </div>
        </div>
      </main>
    </uiset-root>
  </body>
</html>
