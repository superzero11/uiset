<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Checkout page, no React</title>
    <script type="module">
      import "../src/uiset.ts"
      import "../src/templates/checkout.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-template-page">
        <div class="template-frame">
          <div class="checkout" id="checkout">
            <h1 class="checkout-title">Checkout</h1>
            <div class="checkout-body">
              <form class="checkout-form" aria-label="Checkout" novalidate id="form">
                <section class="checkout-section" aria-labelledby="checkout-contact">
                  <h2 id="checkout-contact" class="checkout-section-title">Contact</h2>
                  <ui-field id="email-field">
                    <ui-field-label>Email</ui-field-label>
                    <ui-input><input type="email" autocomplete="email" required id="email" /></ui-input>
                    <ui-field-description>For the receipt and delivery updates.</ui-field-description>
                  </ui-field>
                  <uiset-phone-input id="phone" label="Phone (optional)" description="For delivery questions only." default-country="US" locale="en-US"></uiset-phone-input>
                </section>
                <section class="checkout-section" aria-labelledby="checkout-delivery">
                  <h2 id="checkout-delivery" class="checkout-section-title">Delivery address</h2>
                  <uiset-address-fields id="delivery" label="Delivery address" section="shipping" default-country="US" locale="en-US"></uiset-address-fields>
                </section>
                <section class="checkout-section" aria-labelledby="checkout-shipping">
                  <h2 id="checkout-shipping" class="checkout-section-title">Delivery</h2>
                  <ui-field class="checkout-options-field">
                    <ui-field-label class="uiset-visually-hidden">Delivery option</ui-field-label>
                    <ui-radio-group class="uiset-radio-cards checkout-options" id="options"></ui-radio-group>
                  </ui-field>
                </section>
                <section class="checkout-section" aria-labelledby="checkout-payment">
                  <h2 id="checkout-payment" class="checkout-section-title">Payment</h2>
                  <uiset-payment-fields id="payment"></uiset-payment-fields>
                  <ui-field class="checkout-check">
                    <ui-checkbox id="same" default-checked><ui-checkbox-indicator></ui-checkbox-indicator></ui-checkbox>
                    <ui-field-label>Billing address is the same as delivery</ui-field-label>
                  </ui-field>
                </section>
              </form>
              <aside class="checkout-summary" aria-label="Your order">
                <uiset-order-summary id="order" locale="en-US" quantities>
                  <div id="refused"></div>
                  <uiset-pay-button id="pay" locale="en-US"></uiset-pay-button>
                </uiset-order-summary>
              </aside>
            </div>
          </div>
        </div>
      </main>
    </uiset-root>
  </body>
</html>
