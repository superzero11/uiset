<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Inbox page, no React</title>
    <script type="module">
      import "../src/uiset.ts"
      import "../src/templates/inbox.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <div class="web-template-page">
        <div class="template-frame">
          <div class="inbox-shell" id="shell">
          <uiset-app-shell label="Mail navigation">
            <span data-part="brand" class="template-brand">Acme Mail</span>
            <div data-part="sidebar" class="inbox-sidebar">
              <ui-tooltip><ui-tooltip-trigger><ui-button><button type="button" class="inbox-compose" id="compose" data-variant="solid" data-icon="edit"><span class="sidebar-label">Compose</span></button></ui-button></ui-tooltip-trigger><ui-tooltip-content class="sidebar-tooltip" side="right">Compose</ui-tooltip-content></ui-tooltip>
              <nav class="sidebar-nav" aria-label="Mail folders"><div class="sidebar-group"><ul id="folders"></ul></div></nav>
            </div>
            <div class="inbox" id="inbox">
              <section class="inbox-list" aria-label="Messages" id="list">
                <div class="inbox-list-header">
                  <h1 class="inbox-title" id="folder-title">Inbox</h1>
                  <uiset-search-field id="search" label="Search mail" placeholder="Search mail…"></uiset-search-field>
                </div>
                <div id="list-body"></div>
              </section>
              <section class="inbox-reader" aria-label="Message" id="reader"></section>
            </div>
          </uiset-app-shell>
          </div>
        </div>
      </div>

      <ui-dialog id="composer">
        <ui-dialog-backdrop hidden></ui-dialog-backdrop>
        <ui-dialog-content class="inbox-composer" hidden>
          <ui-dialog-title id="composer-title">New message</ui-dialog-title>
          <ui-dialog-description>Separate several addresses with commas.</ui-dialog-description>
          <form class="admin-form" aria-label="New message" id="compose-form">
            <ui-field name="to"><ui-field-label>To</ui-field-label><ui-input><input name="to" type="email" multiple required autocomplete="email" inputmode="email" enterkeyhint="next" /></ui-input><ui-field-error match="valueMissing">Add someone to send to.</ui-field-error><ui-field-error match="typeMismatch">Use addresses like grace@example.com, separated by commas.</ui-field-error></ui-field>
            <ui-field name="subject"><ui-field-label>Subject</ui-field-label><ui-input><input name="subject" autocomplete="off" /></ui-input></ui-field>
            <ui-field name="body"><ui-field-label>Message</ui-field-label><ui-textarea auto-resize><textarea name="body" required></textarea></ui-textarea><ui-field-error match="valueMissing">Write something first.</ui-field-error></ui-field>
            <div class="admin-form-actions"><ui-dialog-close><button type="button">Discard</button></ui-dialog-close><ui-button><button type="submit" data-icon="send">Send</button></ui-button></div>
          </form>
        </ui-dialog-content>
      </ui-dialog>

      <ui-toast-region aria-label="Notifications">
        <template><ui-toast><div data-slot="stack"><ui-toast-title></ui-toast-title><ui-toast-description></ui-toast-description></div><ui-toast-action><button type="button" data-variant="solid"></button></ui-toast-action><ui-toast-close><button type="button" aria-label="Dismiss"><svg class="uiset-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></ui-toast-close></ui-toast></template>
      </ui-toast-region>
    </uiset-root>
  </body>
</html>
