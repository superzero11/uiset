<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Pricing section, no React</title>
    <script type="module">
      import "../src/uiset.ts"
      import "../src/templates/pricing.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-template-page">
        <div class="template-frame">
          <div class="pricing" id="pricing">
            <header class="pricing-header">
              <h1 class="pricing-title">Simple pricing that grows with you</h1>
              <p class="pricing-lede">Every plan includes unlimited viewers and our full API.</p>
              <ui-segmented-control aria-label="Billing period" default-value="yearly" id="billing">
                <ui-segmented-control-indicator></ui-segmented-control-indicator>
                <ui-segmented-control-item value="monthly">Monthly</ui-segmented-control-item>
                <ui-segmented-control-item value="yearly">Yearly<span class="pricing-save" id="saving"></span></ui-segmented-control-item>
              </ui-segmented-control>
            </header>
            <ul class="pricing-plans" aria-label="Plans" id="plans"></ul>
            <section class="pricing-compare" aria-labelledby="pricing-compare-title">
              <h2 id="pricing-compare-title" class="pricing-section-title">Compare plans</h2>
              <div class="pricing-table-scroller" role="region" aria-labelledby="pricing-compare-title" tabindex="0"><table class="pricing-table" id="compare"></table></div>
            </section>
            <section class="pricing-faq" aria-labelledby="pricing-faq-title">
              <h2 id="pricing-faq-title" class="pricing-section-title">Questions</h2>
              <ui-accordion aria-label="Pricing questions" id="faq"></ui-accordion>
            </section>
          </div>
        </div>
      </main>
    </uiset-root>
  </body>
</html>
