<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <title>UISet Auth pages, no React</title>
    <script type="module">
      import "../src/uiset.ts"
      import "../src/templates/auth.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-template-page">
        <div class="template-frame" id="frame"></div>
      </main>
    </uiset-root>

    <template id="brand"><span class="template-logo" aria-hidden="true"></span>Acme Cloud</template>

    <template id="sign-in">
      <div class="auth-layout"><div class="auth-panel">
        <div class="auth-brand" data-brand></div>
        <div class="auth-heading"><h1 class="auth-title">Sign in</h1><p class="auth-description">Welcome back.</p></div>
        <form class="auth-form" aria-label="Sign in">
          <ui-field name="email">
            <ui-field-label>Email</ui-field-label>
            <ui-input><input name="email" type="email" required autocomplete="email" inputmode="email" enterkeyhint="next" autocapitalize="off" spellcheck="false" /></ui-input>
            <ui-field-error match="valueMissing">Enter your email address.</ui-field-error>
            <ui-field-error match="typeMismatch">Enter an email address like ada@example.com.</ui-field-error>
          </ui-field>
          <ui-field name="password">
            <div class="auth-label-row"><ui-field-label>Password</ui-field-label><a href="#forgot-password" class="auth-link">Forgot password?</a></div>
            <ui-password-input name="password" required data-agent-secret>
              <input autocomplete="current-password" enterkeyhint="done" />
              <ui-password-input-toggle><button type="button" aria-label="Show password" data-variant="ghost"></button></ui-password-input-toggle>
            </ui-password-input>
            <ui-field-error match="valueMissing">Enter your password.</ui-field-error>
          </ui-field>
          <ui-field name="remember" class="auth-check">
            <ui-checkbox name="remember"><ui-checkbox-indicator aria-hidden="true">✓</ui-checkbox-indicator></ui-checkbox>
            <ui-field-label>Keep me signed in</ui-field-label>
          </ui-field>
          <ui-button><button type="submit" class="auth-submit">Sign in</button></ui-button>
          <p class="auth-divider"><span>or</span></p>
          <div class="auth-alternatives">
            <ui-button><button type="button" data-variant="outline">Continue with a passkey</button></ui-button>
            <ui-button><button type="button" data-variant="outline">Email me a sign-in link</button></ui-button>
          </div>
        </form>
        <div class="auth-footer">New here? <a href="#sign-up">Create an account</a></div>
      </div></div>
    </template>

    <template id="sign-up">
      <div class="auth-layout"><div class="auth-panel">
        <div class="auth-brand" data-brand></div>
        <div class="auth-heading"><h1 class="auth-title">Create an account</h1><p class="auth-description">It takes a minute.</p></div>
        <form class="auth-form" aria-label="Create an account">
          <ui-field name="name">
            <ui-field-label>Full name</ui-field-label>
            <ui-input><input name="name" required autocomplete="name" enterkeyhint="next" /></ui-input>
            <ui-field-error match="valueMissing">Enter your name.</ui-field-error>
          </ui-field>
          <ui-field name="email">
            <ui-field-label>Work email</ui-field-label>
            <ui-input><input name="email" type="email" required autocomplete="email" inputmode="email" enterkeyhint="next" autocapitalize="off" spellcheck="false" /></ui-input>
            <ui-field-error match="valueMissing">Enter your email address.</ui-field-error>
            <ui-field-error match="typeMismatch">Enter an email address like ada@example.com.</ui-field-error>
          </ui-field>
          <div data-new-password="New password"></div>
          <ui-field name="terms" class="auth-check">
            <ui-checkbox name="terms" required><ui-checkbox-indicator aria-hidden="true">✓</ui-checkbox-indicator></ui-checkbox>
            <ui-field-label>I agree to the <a href="#terms">terms</a></ui-field-label>
            <ui-field-error match="valueMissing">Accept the terms to continue.</ui-field-error>
          </ui-field>
          <ui-button><button type="submit" class="auth-submit">Create account</button></ui-button>
        </form>
        <div class="auth-footer">Already have an account? <a href="#sign-in">Sign in</a></div>
      </div></div>
    </template>

    <template id="forgot-password">
      <div class="auth-layout"><div class="auth-panel">
        <div class="auth-brand" data-brand></div>
        <div class="auth-heading"><h1 class="auth-title">Reset your password</h1><p class="auth-description">Enter your email and we'll send you a link.</p></div>
        <form class="auth-form" aria-label="Reset your password">
          <ui-field name="email">
            <ui-field-label>Email</ui-field-label>
            <ui-input><input name="email" type="email" required autocomplete="email" inputmode="email" enterkeyhint="send" autocapitalize="off" spellcheck="false" /></ui-input>
            <ui-field-error match="valueMissing">Enter your email address.</ui-field-error>
            <ui-field-error match="typeMismatch">Enter an email address like ada@example.com.</ui-field-error>
          </ui-field>
          <ui-button><button type="submit" class="auth-submit">Send reset link</button></ui-button>
        </form>
        <div class="auth-footer"><a href="#sign-in">Back to sign in</a></div>
      </div></div>
    </template>

    <template id="reset-password">
      <div class="auth-layout"><div class="auth-panel">
        <div class="auth-brand" data-brand></div>
        <div class="auth-heading"><h1 class="auth-title">Choose a new password</h1><p class="auth-description">You'll use it the next time you sign in.</p></div>
        <form class="auth-form" aria-label="Choose a new password">
          <div data-new-password="New password"></div>
          <ui-field name="confirm">
            <ui-field-label>Confirm new password</ui-field-label>
            <ui-password-input name="confirm" required data-agent-secret>
              <input autocomplete="new-password" />
              <ui-password-input-toggle><button type="button" aria-label="Show confirmed password" data-variant="ghost"></button></ui-password-input-toggle>
            </ui-password-input>
            <ui-field-error match="valueMissing">Type the password again.</ui-field-error>
            <ui-field-error match="customError" data-mismatch>The passwords don't match.</ui-field-error>
          </ui-field>
          <ui-button><button type="submit" class="auth-submit">Save password</button></ui-button>
        </form>
      </div></div>
    </template>

    <template id="verify">
      <div class="auth-layout"><div class="auth-panel">
        <div class="auth-brand" data-brand></div>
        <div class="auth-heading"><h1 class="auth-title">Enter your code</h1><p class="auth-description">We sent a 6-digit code to ada@example.com.</p></div>
        <form class="auth-form" aria-label="Enter your code">
          <ui-field name="code">
            <ui-field-label>Verification code</ui-field-label>
            <ui-otp-input name="code" required max-length="6" autocomplete="one-time-code">
              <ui-otp-input-group><ui-otp-input-slot></ui-otp-input-slot><ui-otp-input-slot></ui-otp-input-slot><ui-otp-input-slot></ui-otp-input-slot><ui-otp-input-slot></ui-otp-input-slot><ui-otp-input-slot></ui-otp-input-slot><ui-otp-input-slot></ui-otp-input-slot></ui-otp-input-group>
            </ui-otp-input>
            <ui-field-error match="valueMissing">Enter the 6-digit code.</ui-field-error>
            <ui-field-error match="tooShort">Enter all 6 digits.</ui-field-error>
          </ui-field>
          <ui-button><button type="submit" class="auth-submit">Verify</button></ui-button>
          <ui-button><button type="button" data-variant="ghost" data-resend></button></ui-button>
        </form>
      </div></div>
    </template>
  </body>
</html>
