<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <title>UISet Dashboard page, no React</title>
    <script type="module">
      import "@ui-sdk/web/segmented-control"
      import "../src/uiset.ts"
      import "../src/templates/dashboard.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <div class="web-template-page">
        <div class="template-frame">
          <uiset-app-shell label="Dashboard navigation">
            <span data-part="brand" class="template-brand">Acme Cloud</span>
            <nav data-part="sidebar" class="sidebar-nav" aria-label="Dashboard sections" id="nav"></nav>
            <div class="dashboard">
              <uiset-page-header title="Overview" id="header">
                <div class="dashboard-filters">
                  <ui-segmented-control aria-label="Date range" default-value="30" id="range">
                    <ui-segmented-control-indicator></ui-segmented-control-indicator>
                    <ui-segmented-control-item value="7">7 days</ui-segmented-control-item>
                    <ui-segmented-control-item value="30">30 days</ui-segmented-control-item>
                    <ui-segmented-control-item value="90">90 days</ui-segmented-control-item>
                  </ui-segmented-control>
                </div>
              </uiset-page-header>
              <section class="dashboard-figures" aria-label="Key figures">
                <uiset-stat label="Revenue" id="stat-revenue"></uiset-stat>
                <uiset-stat label="Orders" id="stat-orders"></uiset-stat>
                <uiset-stat label="Paid plans" id="stat-paid"></uiset-stat>
                <uiset-stat label="Refund rate" id="stat-refunds"></uiset-stat>
              </section>
              <uiset-empty-state icon="reports" id="empty" hidden></uiset-empty-state>
              <div id="results" class="dashboard-results">
                <div class="dashboard-charts">
                  <uiset-line-chart class="dashboard-wide" label="Revenue" id="revenue-chart" layout="area"></uiset-line-chart>
                  <uiset-bar-chart label="Orders by channel" description="Stacked by plan" id="channel-chart" layout="stacked" orientation="horizontal" sort="descending"></uiset-bar-chart>
                  <uiset-segmented-bar label="Plan mix" id="plan-chart"></uiset-segmented-bar>
                </div>
                <section class="dashboard-table" aria-labelledby="dashboard-recent">
                  <h2 id="dashboard-recent" class="dashboard-section-title">Recent orders</h2>
                  <uiset-data-grid label="Recent orders" id="orders" toolbar filename="recent-orders" height="22rem" locale="en-US"></uiset-data-grid>
                </section>
              </div>
            </div>
          </uiset-app-shell>
        </div>
      </div>
    </uiset-root>
  </body>
</html>
