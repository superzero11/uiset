<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <title>UISet Board, no React</title>
    <script type="module">
      import "@ui-sdk/web/button"
      import "@ui-sdk/web/dialog"
      import "@ui-sdk/web/field"
      import "@ui-sdk/web/input"
      import "@ui-sdk/web/toast"
      import "./src/uiset.ts"
      import "./src/board-demo.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-board-page">
        <h1>Sprint board</h1>
        <div class="board-toolbar" role="group" aria-label="Sprint board tools">
          <ui-field name="search">
            <ui-field-label class="uiset-visually-hidden">Search cards</ui-field-label>
            <ui-input><input type="search" id="search" placeholder="Search cards…" autocomplete="off" /></ui-input>
          </ui-field>
        </div>
        <uiset-board id="board" aria-label="Sprint board" today="2026-11-15" addable openable></uiset-board>

        <!-- Card details: the board fires `open`; moves go through board.api, so the column
             limits hold and `laneschange` fires. -->
        <ui-dialog id="card-dialog">
          <ui-dialog-backdrop hidden></ui-dialog-backdrop>
          <ui-dialog-content hidden class="board-dialog">
            <ui-dialog-title id="card-title"></ui-dialog-title>
            <ui-dialog-description id="card-where"></ui-dialog-description>
            <p class="board-dialog-error" role="alert" id="card-error" hidden></p>
            <div class="board-dialog-actions" id="card-moves"></div>
            <div class="board-dialog-actions">
              <ui-button><button type="button" data-variant="outline" id="card-delete" data-agent-confirm="Deletes this card">Delete card</button></ui-button>
              <span class="board-dialog-spacer"></span>
              <ui-dialog-close><button type="button">Close</button></ui-dialog-close>
            </div>
          </ui-dialog-content>
        </ui-dialog>
      </main>
      <ui-toast-region aria-label="Notifications">
        <template>
          <ui-toast>
            <div data-slot="stack">
              <ui-toast-title></ui-toast-title>
              <ui-toast-description></ui-toast-description>
            </div>
            <ui-toast-action><button type="button" data-variant="solid"></button></ui-toast-action>
          <ui-toast-close><button type="button" aria-label="Dismiss"><svg class="uiset-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></ui-toast-close></ui-toast>
        </template>
      </ui-toast-region>
    </uiset-root>
  </body>
</html>
