<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Chat, no React</title>
    <script type="module">
      import "./src/uiset.ts"
      import "./src/chat-demo.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-chat-page">
        <uiset-chat-threads id="threads" label="Chats" value="t1" newable renamable deletable></uiset-chat-threads>
        <section class="web-chat-main" aria-label="Chat">
          <uiset-chat id="chat" label="Conversation" editable></uiset-chat>
          <uiset-chat-queue id="queue" send-now></uiset-chat-queue>
          <uiset-chat-composer id="composer" label="Message" placeholder="Ask about your project…" attachments="image/*,.pdf" queue></uiset-chat-composer>
        </section>
      </main>
    </uiset-root>
  </body>
</html>
