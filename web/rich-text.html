<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Rich Text, no React</title>
    <script type="module">
      import "@ui-sdk/web/tabs"
      import "./src/uiset.ts"
      import "./src/rich-text-demo.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-demo">
        <div class="web-demo-head">
          <h1>Rich text</h1>
          <p>Headings, lists, to-dos, quotes, code and links. Type / for blocks and @ to mention someone. Agents read and write the same Markdown.</p>
        </div>
        <div class="web-rich-text">
          <uiset-rich-text
            id="notes"
            label="Release notes"
            placeholder="Write the release notes… Type / for blocks, @ to mention someone."
            max-length="2000"
            name="notes"
          ></uiset-rich-text>
          <ui-tabs default-value="preview" class="web-rich-text-output">
            <ui-tabs-list aria-label="Output">
              <ui-tabs-tab value="preview"><button type="button">Preview</button></ui-tabs-tab>
              <ui-tabs-tab value="markdown"><button type="button">Markdown</button></ui-tabs-tab>
              <ui-tabs-tab value="html"><button type="button">HTML</button></ui-tabs-tab>
            </ui-tabs-list>
            <ui-tabs-panel value="preview"><uiset-rich-text-content id="preview"></uiset-rich-text-content></ui-tabs-panel>
            <ui-tabs-panel value="markdown"><pre class="web-rich-text-source" translate="no"><code id="markdown"></code></pre></ui-tabs-panel>
            <ui-tabs-panel value="html"><pre class="web-rich-text-source" translate="no"><code id="html"></code></pre></ui-tabs-panel>
          </ui-tabs>
        </div>
      </main>
    </uiset-root>
  </body>
</html>
