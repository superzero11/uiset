<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Saira+Semi+Condensed:wght@400;500;600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Spline+Sans+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/demo.css" />
    <title>UISet Scheduler, no React</title>
    <script type="module">
      import "@ui-sdk/web/button"
      import "@ui-sdk/web/dialog"
      import "@ui-sdk/web/field"
      import "@ui-sdk/web/input"
      import "@ui-sdk/web/segmented-control"
      import "@ui-sdk/web/select"
      import "./src/uiset.ts"
      import "./src/schedule-demo.ts"
    </script>
  </head>
  <body>
    <uiset-root skin="base" id="root">
      <main class="web-schedule-page">
        <!-- The toolbar is the page's own: UI SDK's buttons and segmented control. -->
        <div class="scheduler-toolbar" role="group" aria-label="Schedule tools">
          <div class="scheduler-nav">
            <ui-button><button type="button" data-variant="outline" id="today">Today</button></ui-button>
            <ui-button><button type="button" data-variant="ghost" id="previous" aria-label="Previous week" data-icon="previous"></button></ui-button>
            <ui-button><button type="button" data-variant="ghost" id="next" aria-label="Next week" data-icon="next"></button></ui-button>
            <h2 class="scheduler-title" aria-live="polite" id="title"></h2>
          </div>
          <div class="scheduler-actions">
            <ui-segmented-control id="view" default-value="week" aria-label="View">
              <ui-segmented-control-indicator></ui-segmented-control-indicator>
              <ui-segmented-control-item value="day">Day</ui-segmented-control-item>
              <ui-segmented-control-item value="week">Week</ui-segmented-control-item>
              <ui-segmented-control-item value="month">Month</ui-segmented-control-item>
              <ui-segmented-control-item value="timeline">Rooms</ui-segmented-control-item>
            </ui-segmented-control>
            <ui-button><button type="button" id="new-event" data-icon="plus">New event</button></ui-button>
          </div>
        </div>

        <uiset-schedule id="schedule" aria-label="Team week" start-hour="8" end-hour="18" today="2026-11-16" time-zone="UTC" openable></uiset-schedule>
        <!-- A timeline is its own schedule: the axis is set when a schedule starts. -->
        <uiset-schedule id="rooms" aria-label="Rooms" axis="x" overlap="false" start-hour="8" end-hour="18" today="2026-11-16" time-zone="UTC" openable hidden></uiset-schedule>
        <uiset-schedule-month id="month" month="2026-11" today="2026-11-16" label="November 2026" hidden></uiset-schedule-month>

        <ui-dialog id="event-dialog">
          <ui-dialog-backdrop hidden></ui-dialog-backdrop>
          <ui-dialog-content hidden class="scheduler-dialog">
            <ui-dialog-title id="event-dialog-title">New event</ui-dialog-title>
            <ui-dialog-description id="event-dialog-description">Add it to the schedule.</ui-dialog-description>
            <form class="scheduler-form" id="event-form">
              <ui-field name="event-title">
                <ui-field-label>Title</ui-field-label>
                <ui-input><input name="event-title" required autocomplete="off" id="event-title" /></ui-input>
              </ui-field>
              <ui-select name="event-track" id="event-track">
                <ui-select-label>When</ui-select-label>
                <ui-select-trigger><button type="button"><ui-select-value></ui-select-value></button></ui-select-trigger>
                <ui-select-content id="event-track-list"></ui-select-content>
              </ui-select>
              <div class="scheduler-form-row">
                <ui-field name="event-start">
                  <ui-field-label>Starts</ui-field-label>
                  <ui-input><input type="time" name="event-start" required step="900" id="event-start" /></ui-input>
                </ui-field>
                <ui-field name="event-end">
                  <ui-field-label>Ends</ui-field-label>
                  <ui-input><input type="time" name="event-end" required step="900" id="event-end" /></ui-input>
                </ui-field>
              </div>
              <p class="scheduler-error" role="alert" id="event-error" hidden></p>
              <div class="scheduler-dialog-actions">
                <ui-button><button type="button" data-variant="outline" id="event-delete" data-agent-confirm="Deletes this event">Delete</button></ui-button>
                <span class="scheduler-dialog-spacer"></span>
                <ui-dialog-close><button type="button" data-variant="ghost">Cancel</button></ui-dialog-close>
                <ui-button><button type="submit">Save</button></ui-button>
              </div>
            </form>
          </ui-dialog-content>
        </ui-dialog>
      </main>
    </uiset-root>
  </body>
</html>
