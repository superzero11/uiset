name: CI

# Started by hand for now: the account's Actions are on hold, and a run that can't start shows
# as a failed check on every commit. Until then, `pnpm check` runs before every change. To
# turn it back on, restore these triggers:
#   push: { branches: [main] }
#   pull_request:
#   schedule: [{ cron: "17 3 * * *" }]   # nightly, also against UI SDK's newest beta
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.sdk == 'beta' && 'Check (UI SDK beta tag)' || 'Check' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ github.event_name == 'schedule' && fromJSON('["pinned","beta"]') || fromJSON('["pinned"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.sdk == 'beta'
        run: pnpm add @ui-sdk/core@beta @ui-sdk/react@beta
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e
      - name: Registry is valid and up to date
        run: |
          node scripts/registry.mjs
          pnpm exec shadcn registry validate ./registry.json
          git diff --exit-code registry.json
      - run: scripts/install-test.sh
      - run: pnpm build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.sdk }}
          path: test-results
          retention-days: 7
